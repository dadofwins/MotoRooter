# Runs the same `make check` the engineers run locally.
#
# Deliberately NOT on every branch push. `make handoff` already gates every handoff locally
# and a pre-push hook gates `main`, so branch-push CI was almost pure duplication — and it
# actively misfired on `make handoff-blocked` branches, which are pushed *known* to fail by
# design and generated a failure email every time. Guarding `main` is where CI earns its keep.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # run against a branch on demand when it is actually wanted

concurrency:
  # Supersede in-flight runs for the same branch; only the tip matters.
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          # Pinned so CI and every worktree resolve the same interpreter. Without it uv
          # picks whatever the runner ships, and a version-dependent failure appears only
          # in CI, which is the hardest place to reproduce one.
          python-version: "3.13"

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: uv sync --frozen

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      # Regenerates the OpenAPI document and the frontend types, then fails if either
      # differs from what was committed. This is what stops the backend changing a shape
      # without the frontend's generated types following.
      - name: Contract is in sync
        run: make contract-check

      - name: Tests
        run: make test
